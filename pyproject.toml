[project]
name = "flowxav"
version = "0.1.0"
description = "Guidage interactif du cockpit pour Microsoft Flight Simulator : de Cold & Dark à prêt au départ"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Xavier BEGUE (xalacaga)" }]
readme = "README.md"
keywords = ["msfs", "flight-simulator", "simconnect", "cockpit", "checklist", "tutorial"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2.0,<3",
    "uvicorn>=0.29,<1",
    # Fenêtre Windows native embarquant l'interface dans Edge WebView2.
    "pywebview>=6.0,<7 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "httpx>=0.27,<1"]

[project.urls]
Source = "https://github.com/xalacaga/FlowXav"
Issues = "https://github.com/xalacaga/FlowXav/issues"

[project.gui-scripts]
flowxav = "flowxav.desktop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flowxav*"]

[tool.setuptools.package-data]
"flowxav" = ["web/static/*", "aircraft/*/*.json", "aircraft/*/procedures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = [
    "live_msfs: tests d'intégration qui nécessitent MSFS démarré",
    "live_network: tests opt-in qui interrogent un service Internet réel",
    "installed: smoke tests d'un exécutable FlowXav construit ou installé",
]
